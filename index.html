<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>FDM Maintenance</title>

  <style>
    body {
  font-family: Arial, sans-serif;
  padding: 10px;
  max-width: 600px;
  margin: auto;
  background: #f5f7fa;
}

h2 {
  text-align: center;
  margin-bottom: 10px;
}

h3 {
  margin-top: 20px;
  margin-bottom: 5px;
  font-size: 16px;
}

p {
  margin: 5px 0;
}

input, textarea, select {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
  box-sizing: border-box;
  background: white;
}

textarea {
  min-height: 90px;
}

button {
  width: 100%;
  padding: 18px;
  font-size: 18px;
  margin-top: 15px;
  background-color: #0078D7;
  color: white;
  border: none;
  border-radius: 12px;
  font-weight: bold;
}

button:active {
  background-color: #005a9e;
}

/* Cards (effet bloc) */
.section {
  background: white;
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* Dropdown amélioré */
.dropdown {
  border: 1px solid #ccc;
  max-height: 160px;
  overflow-y: auto;
  display: none;
  background: white;
  border-radius: 10px;
}

.dropdown div {
  padding: 14px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.dropdown div:hover {
  background-color: #e6f2ff;
}

/* Champs obligatoires */
.required {
  color: red;
  font-weight: bold;
}


  </style>
</head>

<body>

  <h2>🔧 FDM Maintenance</h2>
  <p style="text-align:center;color:red;">* Champs obligatoires</p>
  
  <div class="section">
    <h3>Equipement <span class="required">*</span></h3>
    <input type="text" id="equipement">
    <div id="equipementList" class="dropdown"></div>
  </div>
  
  <div class="section">
    <h3>Description panne <span class="required">*</span></h3>
    <textarea id="description"></textarea>
  </div>
  
  <div class="section">
    <h3>Date de détection <span class="required">*</span></h3>
    <input type="date" id="date">
  </div>
  
  <div class="section">
    <h3>Site de détection <span class="required">*</span></h3>
    <input type="text" id="site">
    <div id="siteList" class="dropdown"></div>
  </div>
  
  <div class="section">
    <h3>Matériel utilisable <span class="required">*</span></h3>
    <select id="materiel">
      <option value="">Choisir</option>
      <option>Oui</option>
      <option>Oui en mode dégradé</option>
      <option>Non</option>
    </select>
  </div>
  
  <div class="section">
    <h3>Action corrective immédiate</h3>
    <textarea id="action1"></textarea>
  </div>
  
  <div class="section">
    <h3>Action à mettre en place</h3>
    <textarea id="action2"></textarea>
  </div>
  
  <div class="section">
    <h3>Rédacteur <span class="required">*</span></h3>
    <input type="text" id="redacteur">
  </div>
  
  <button onclick="envoyer()">✅ Envoyer la fiche</button>

<script>

// ✅ variables globales
let equipements = [];
let sites = [];

// ✅ AUTOCOMPLETE GENERIQUE
function createAutocomplete(inputId, listId, dataList) {

  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);

  input.addEventListener("focus", () => {
    showList("");
  });

  input.addEventListener("input", () => {
    showList(input.value);
  });

  function showList(filter) {

    const val = filter.toLowerCase();

    const results = dataList
      .filter(item => item.toLowerCase().includes(val))
      .slice(0, 200);

    if (results.length === 0) {
      list.innerHTML = "<div>Aucun résultat</div>";
    } else {
      list.innerHTML = results.map(item => `
        <div onclick="selectItem('${item.replace(/'/g, "\\'")}', '${inputId}', '${listId}')">
          ${item}
        </div>
      `).join("");
    }

    list.style.display = "block";
  }
}

// ✅ sélection
function selectItem(value, inputId, listId) {
  document.getElementById(inputId).value = value;
  document.getElementById(listId).style.display = "none";
}

// ✅ charger JSON
Promise.all([
  fetch("equipements.json").then(res => res.json()),
  fetch("sites.json").then(res => res.json())
]).then(([equipData, siteData]) => {

  equipements = equipData;
  sites = siteData;

  console.log("Equipements :", equipements.length);
  console.log("Sites :", sites.length);

  createAutocomplete("equipement", "equipementList", equipements);
  createAutocomplete("site", "siteList", sites);

});

// ✅ fermer liste si clic ailleurs
document.addEventListener("click", function(e) {
  if (!e.target.closest(".dropdown") && !e.target.closest("input")) {
    document.querySelectorAll(".dropdown").forEach(d => d.style.display = "none");
  }
});

// ✅ ENVOI
function envoyer() {

  const equipement = document.getElementById("equipement").value;
  const description = document.getElementById("description").value;
  const date = document.getElementById("date").value;
  const site = document.getElementById("site").value;
  const materiel = document.getElementById("materiel").value;
  const action1 = document.getElementById("action1").value;
  const action2 = document.getElementById("action2").value;
  const redacteur = document.getElementById("redacteur").value;

  if (!equipement || !description || !date || !site || !materiel || !redacteur) {
    alert("⚠️ Merci de remplir les champs obligatoires");
    return;
  }

  let baseUrl = "https://forms.office.com/Pages/ResponsePage.aspx?id=esFuUS-5i0OFlOEbb2vseRjkMUtrzTFJgkDRO6ovM4RUQzRENktIUTY4V0YwUFVVQ01QSlk5WkVPWC4u";

  let url = baseUrl
    + "&r6224cbff49d94b79a69654caa3241ddf=" + encodeURIComponent(equipement)
    + "&r936dbfbe7b3a4f0ba57f4406807e37a5=" + encodeURIComponent(description)
    + "&rb1e2f7df928f43beacbe59f537d8b09b=" + encodeURIComponent(date)
    + "&r3fedaea8875d40899833d017ba9ff9fa=" + encodeURIComponent(site)
    + "&r9ac54388070a43748ea2b5514ff712d8=" + encodeURIComponent(materiel)
    + "&ra23df662a36640e2912b5bed96b080ee=" + encodeURIComponent(action1)
    + "&rdd29c9cd9da649e8a41549e52d9f6374=" + encodeURIComponent(action2)
    + "&r38c32352ebca4f7e88f37c0de9bf0bf0=" + encodeURIComponent(redacteur);

  window.location.href = url;
}

</script>

</body>
</html>
