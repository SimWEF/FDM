<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>FDM Maintenance</title>

  <style>
    body {
      font-family: Arial;
      padding: 15px;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      margin-top: 20px;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 80px;
    }

    #results div {
      padding: 10px;
      border-bottom: 1px solid #ccc;
      cursor: pointer;
    }

    #results div:hover {
      background-color: #f0f0f0;
    }

    .selected {
      background-color: #d0f0ff;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #00aaff;
    }

    button {
      background-color: #0078D7;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
    }

    button:active {
      background-color: #005a9e;
    }
  </style>
</head>

<body>

<h2>🔧 FDM Maintenance v2</h2>

<!-- 🔎 Recherche -->
<h3>Recherche équipement</h3>

<input type="text" id="search" placeholder="Tape ID ou nom (min 2 caractères)">

<div id="results"></div>

<div id="selectedBox" class="selected" style="display:none;"></div>

<!-- 📝 Formulaire -->
<h3>Fiche maintenance</h3>

<input type="text" id="equipement" placeholder="Equipement sélectionné" readonly>

<textarea id="description" placeholder="Description panne"></textarea>

<input type="date" id="date">

<select id="site">
  <option value="">Site de détection</option>
  <option value="CNPE">CNPE</option>
  <option value="Chantier">Chantier</option>
  <option value="Atelier">Atelier</option>
  <option value="Magasin">Magasin</option>
</select>

<select id="materiel">
  <option value="">Matériel utilisable</option>
  <option value="Oui">Oui</option>
  <option value="Oui en mode dégradé">Oui en mode dégradé</option>
  <option value="Non">Non</option>
</select>

<textarea id="action1" placeholder="Action corrective immédiate"></textarea>

<textarea id="action2" placeholder="Action à mettre en place"></textarea>

<input type="text" id="redacteur" placeholder="Rédacteur">
``

<button onclick="envoyer()">Envoyer</button>

<script>

// ✅ Chargement des équipements depuis JSON
let equipements = [];

fetch("equipements.json")
  .then(res => res.json())
  .then(data => {
    equipements = data;
    console.log("Equipements chargés :", equipements.length);
  });

// 🔎 Recherche dynamique
document.getElementById("search").oninput = function() {

  const val = this.value.toLowerCase();

  if (val.length < 2) {
    document.getElementById("results").innerHTML = "";
    return;
  }

  const results = equipements
    .filter(e => e.toLowerCase().includes(val))
    .slice(0, 15);

  document.getElementById("results").innerHTML =
    results.map(e => `
      <div onclick="selectEquip('${e.replace(/'/g, "\\'")}')">
        ${e}
      </div>
    `).join("");
};

// ✅ Sélection équipement
function selectEquip(eq) {

  document.getElementById("equipement").value = eq;

  document.getElementById("results").innerHTML = "";
  document.getElementById("search").value = "";

  document.getElementById("selectedBox").style.display = "block";
  document.getElementById("selectedBox").innerText = "✅ " + eq;

  document.getElementById("description").focus();
}

// 📤 Envoi
function envoyer() {

  const equipement = document.getElementById("equipement").value;
  const description = document.getElementById("description").value;
  const date = document.getElementById("date").value;
  const site = document.getElementById("site").value;
  const materiel = document.getElementById("materiel").value;
  const action1 = document.getElementById("action1").value;
  const action2 = document.getElementById("action2").value;
  const redacteur = document.getElementById("redacteur").value;

  // ✅ Vérification champs obligatoires
  if (!equipement || !description || !date || !site || !materiel || !redacteur) {
    alert("⚠️ Merci de remplir les champs obligatoires");
    return;
  }

  let baseUrl = "https://forms.office.com/Pages/ResponsePage.aspx?id=esFuUS-5i0OFlOEbb2vseRjkMUtrzTFJgkDRO6ovM4RUQzRENktIUTY4V0YwUFVVQ01QSlk5WkVPWC4u";

  let url = baseUrl
    + "&r6224cbff49d94b79a69654caa3241ddf=" + encodeURIComponent(equipement)
    + "&r936dbfbe7b3a4f0ba57f4406807e37a5=" + encodeURIComponent(description)
    + "&rb1e2f7df928f43beacbe59f537d8b09b=" + encodeURIComponent(date)
    + "&r3fedaea8875d40899833d017ba9ff9fa=" + encodeURIComponent(site)
    + "&r9ac54388070a43748ea2b5514ff712d8=" + encodeURIComponent(materiel)
    + "&ra23df662a36640e2912b5bed96b080ee=" + encodeURIComponent(action1)
    + "&rdd29c9cd9da649e8a41549e52d9f6374=" + encodeURIComponent(action2)
    + "&r38c32352ebca4f7e88f37c0de9bf0bf0=" + encodeURIComponent(redacteur);

  // ✅ Redirection fluide
  window.location.href = url;
}

</script>

</body>
</html>
