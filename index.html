<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>FDM Maintenance</title>

  <style>
body {
  font-family: Arial;
  background: #f0f2f5;
  padding: 10px;
}

h2 {
  text-align: center;
  font-size: 20px;
}

.info {
  text-align: center;
  color: red;
  font-weight: bold;
}

.section {
  background: white;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 14px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}

h3 {
  font-size: 16px;
  margin-bottom: 6px;
}

input, textarea, select {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  border-radius: 12px;
  border: 1px solid #ccc;
}

textarea {
  min-height: 100px;
}

.btn-main {
  background: #0078D7;
  color: white;
  padding: 18px;
  font-size: 20px;
  border-radius: 14px;
  width: 100%;
  font-weight: bold;
}

.btn-secondary {
  background: #ff9800;
  color: white;
  margin-top: 8px;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
}

.dropdown {
  background: white;
  border-radius: 10px;
  max-height: 180px;
  overflow-y: auto;
  margin-top: 5px;
  display: none;
  border: 1px solid #ccc;
}

.dropdown div {
  padding: 14px;
  font-size: 16px;
}

.dropdown div:hover {
  background: #e6f2ff;
}
  </style>
</head>

<body>

<h2>🔧 FDM Maintenance</h2>
<p class="info">* Champs obligatoires</p>

<div class="section">
  <h3>Equipement *</h3>
  <input type="text" id="equipement">
  <div id="equipementList" class="dropdown"></div>
</div>

<div class="section">
  <h3>Description *</h3>
  <textarea id="description"></textarea>

  <!-- ✅ bouton RAS -->
  <button class="btn-secondary" onclick="remplirRAS()">RAS</button>
</div>

<div class="section">
  <h3>Date *</h3>
  <input type="date" id="date">
</div>

<div class="section">
  <h3>Site *</h3>
  <input type="text" id="site">
  <div id="siteList" class="dropdown"></div>
</div>

<div class="section">
  <h3>Matériel utilisable *</h3>
  <select id="materiel">
    <option value="">Choisir</option>
    <option>✅ Oui</option>
    <option>⚠️ Oui dégradé</option>
    <option>❌ Non</option>
  </select>
</div>

<div class="section">
  <h3>Actions</h3>
  <textarea id="action1" placeholder="Correction immédiate"></textarea>
  <textarea id="action2" placeholder="Action à mettre en place"></textarea>
</div>

<div class="section">
  <h3>Rédacteur *</h3>
  <input type="text" id="redacteur">
</div>

<button class="btn-main" onclick="envoyer()">
  ✅ ENVOYER LA FICHE vers Forms
</button>

<script>

// ✅ variables globales
let equipements = [];
let sites = [];


// fonction RAS
function remplirRAS() {
  document.getElementById("description").value = "RAS";
  document.getElementById("materiel").value = "✅ Oui";
}

// ✅ AUTOCOMPLETE GENERIQUE
function createAutocomplete(inputId, listId, dataList) {

  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);

  input.addEventListener("focus", () => {
    showList("");
  });

  input.addEventListener("input", () => {
    showList(input.value);
  });

  function showList(filter) {

    const val = filter.toLowerCase();

    const results = dataList
      .filter(item => item.toLowerCase().includes(val))
      .slice(0, 200);

    if (results.length === 0) {
      list.innerHTML = "<div>Aucun résultat</div>";
    } else {
      list.innerHTML = results.map(item => `
        <div onclick="selectItem('${item.replace(/'/g, "\\'")}', '${inputId}', '${listId}')">
          ${item}
        </div>
      `).join("");
    }

    list.style.display = "block";
  }
}

// ✅ sélection
function selectItem(value, inputId, listId) {
  document.getElementById(inputId).value = value;
  document.getElementById(listId).style.display = "none";
}

// ✅ charger JSON
Promise.all([
  fetch("equipements.json").then(res => res.json()),
  fetch("sites.json").then(res => res.json())
]).then(([equipData, siteData]) => {

  equipements = equipData;
  sites = siteData;

  console.log("Equipements :", equipements.length);
  console.log("Sites :", sites.length);

  createAutocomplete("equipement", "equipementList", equipements);
  createAutocomplete("site", "siteList", sites);

});

// ✅ fermer liste si clic ailleurs
document.addEventListener("click", function(e) {
  if (!e.target.closest(".dropdown") && !e.target.closest("input")) {
    document.querySelectorAll(".dropdown").forEach(d => d.style.display = "none");
  }
});


// ✅ Auto date (remplit la date du jour)
document.getElementById("date").valueAsDate = new Date();

// ✅ ENVOI
function envoyer() {

const equipement = document.getElementById("equipement").value;
const description = document.getElementById("description").value;
const date = document.getElementById("date").value;
const site = document.getElementById("site").value;
const materiel = document.getElementById("materiel").value;
const redacteur = document.getElementById("redacteur").value;

if (!equipement || !description || !date || !site || !materiel || !redacteur) {
  alert("⚠️ Champs obligatoires manquants");
  return;
}

if (!confirm("✅ Confirmer l'envoi de la fiche ?")) return;

let baseUrl = "https://forms.office.com/Pages/ResponsePage.aspx?id=esFuUS-5i0OFlOEbb2vseRjkMUtrzTFJgkDRO6ovM4RUQzRENktIUTY4V0YwUFVVQ01QSlk5WkVPWC4u";

let url = baseUrl
  + "&r6224cbff49d94b79a69654caa3241ddf=" + encodeURIComponent(equipement)
  + "&r936dbfbe7b3a4f0ba57f4406807e37a5=" + encodeURIComponent(description)
  + "&rb1e2f7df928f43beacbe59f537d8b09b=" + encodeURIComponent(date)
  + "&r3fedaea8875d40899833d017ba9ff9fa=" + encodeURIComponent(site)
  + "&r9ac54388070a43748ea2b5514ff712d8=" + encodeURIComponent(materiel)
  + "&r38c32352ebca4f7e88f37c0de9bf0bf0=" + encodeURIComponent(redacteur);

window.location.href = url;
}

</script>

</body>
</html>
