<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>FDM Maintenance</title>

  <style>
    body {
      font-family: Arial;
      padding: 15px;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      margin-top: 20px;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 80px;
    }

    #results div {
      padding: 10px;
      border-bottom: 1px solid #ccc;
      cursor: pointer;
    }

    #results div:hover {
      background-color: #f0f0f0;
    }

    .selected {
      background-color: #d0f0ff;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #00aaff;
    }

    button {
      background-color: #0078D7;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
    }

    button:active {
      background-color: #005a9e;
    }
  </style>
</head>

<body>

<h2>🔧 FDM Maintenance v2</h2>

<!-- 🔎 Recherche -->
<h3>Recherche équipement</h3>

<input type="text" id="search" placeholder="Tape ID ou nom (min 2 caractères)">

<div id="results"></div>

<div id="selectedBox" class="selected" style="display:none;"></div>

<!-- 📝 Formulaire -->
<h3>Fiche maintenance</h3>

<input type="text" id="equipement" placeholder="Equipement sélectionné" readonly>

<textarea id="description" placeholder="Description panne"></textarea>

<textarea id="action" placeholder="Action corrective"></textarea>

<select id="priorite">
  <option value="">Priorité</option>
  <option>A - Critique</option>
  <option>B - Important</option>
  <option>C - Mineur</option>
</select>

<select id="statut">
  <option value="">Statut</option>
  <option>A faire</option>
  <option>En cours</option>
  <option>Terminé</option>
</select>

<button onclick="envoyer()">Envoyer</button>

<script>

// ✅ Chargement des équipements depuis JSON
let equipements = [];

fetch("equipements.json")
  .then(res => res.json())
  .then(data => {
    equipements = data;
    console.log("Equipements chargés :", equipements.length);
  });

// 🔎 Recherche dynamique
document.getElementById("search").oninput = function() {

  const val = this.value.toLowerCase();

  if (val.length < 2) {
    document.getElementById("results").innerHTML = "";
    return;
  }

  const results = equipements
    .filter(e => e.toLowerCase().includes(val))
    .slice(0, 15);

  document.getElementById("results").innerHTML =
    results.map(e => `
      <div onclick="selectEquip('${e.replace(/'/g, "\\'")}')">
        ${e}
      </div>
    `).join("");
};

// ✅ Sélection équipement
function selectEquip(eq) {

  document.getElementById("equipement").value = eq;

  document.getElementById("results").innerHTML = "";
  document.getElementById("search").value = "";

  document.getElementById("selectedBox").style.display = "block";
  document.getElementById("selectedBox").innerText = "✅ " + eq;

  document.getElementById("description").focus();
}

// 📤 Envoi
function envoyer() {

  const equipement = document.getElementById("equipement").value;

  if (!equipement) {
    alert("⚠️ Sélectionner un équipement");
    return;
  }

  // ✅ ton URL de base (SANS Test à la fin)
  let baseUrl = "https://forms.office.com/Pages/ResponsePage.aspx?id=esFuUS-5i0OFlOEbb2vseRjkMUtrzTFJgkDRO6ovM4RUQzRENktIUTY4V0YwUFVVQ01QSlk5WkVPWC4u";

  // ✅ ID du champ équipement
  let champEquipement = "r6224cbff49d94b79a69654caa3241ddf";

  // ✅ construction de l'URL finale
  let url = baseUrl + "&" + champEquipement + "=" + encodeURIComponent(equipement);

  // ✅ ouvre le formulaire pré-rempli
  window.open(url, "_blank");
}

</script>

</body>
</html>
