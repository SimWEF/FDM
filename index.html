<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>FDM Maintenance</title>

  <style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 8px;
  background: #f4f6f8;
}


.container {
  width: 100%;
  max-width: 100%;
}


/* titre */

h2 {
  font-size: 20px;
}


/* info */
.info {
  text-align: center;
  color: red;
  font-size: 12px;
}

/* ligne compacte */
.row {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
}

/* label à gauche */


.label {
  font-size: 15px;
}



/* champ à droite */
.field {
  width: 60%;
}

/* inputs */

input, textarea, select {
  padding: 12px;
  font-size: 16px;
}



/* textarea réduit */
textarea {
  min-height: 80px;
  resize: none;
}

/* bouton */
.btn-main {
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  font-size: 16px;
  background: #0078D7;
  color: white;
  border-radius: 8px;
  border: none;
}
.btn-group-horizontal {
  display: flex;
  gap: 6px;
}

.btn-group-horizontal button {
  flex: 1;
  padding: 12px;
  font-size: 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
  background: #f0f0f0;
}

.btn-group-horizontal button.active {
  background-color: #0078D7;
  color: white;
  border-color: #0078D7;
}


/* dropdown */
.dropdown {
  position: absolute;
  background: white;
  border: 1px solid #ccc;
  width: 90%;
  max-height: 150px;
  overflow-y: auto;
  display: none;
  z-index: 1000;
}

.dropdown div {
  padding: 8px;
  font-size: 13px;
}

.dropdown div:hover {
  background: #e6f2ff;
}

  </style>
</head>

<body>

<div class="container">

  <h2>🔧 FDM</h2>
  <p class="info">* obligatoires</p>
  
  <div class="row">
    <div class="label">Equipement *</div>
    <div class="field">
      <input type="text" id="equipement">
      <div id="equipementList" class="dropdown"></div>
    </div>
  </div>
  
  <div class="row">
    <div class="label">Description *</div>
    <div class="field">
      <textarea id="description"></textarea>
    </div>
  </div>
  
  <div class="row">
    <div class="label">Date *</div>
    <div class="field">
      <input type="date" id="date">
    </div>
  </div>
  
  <div class="row">
    <div class="label">Site *</div>
    <div class="field">
      <input type="text" id="site">
      <div id="siteList" class="dropdown"></div>
    </div>
  </div>
  
  <div class="row">
    <div class="label">Matériel Utilisable? *</div>
    <div class="field">
  
      <div class="btn-group-horizontal">
        <button type="button" onclick="selectMateriel('Oui', this)">Oui</button>
        <button type="button" onclick="selectMateriel('Oui dégradé', this)">Dégradé</button>
        <button type="button" onclick="selectMateriel('Non', this)">Non</button>
      </div>
  
      <input type="hidden" id="materiel">
    </div>
  </div>
  
  
  
  <div class="row">
    <div class="label">Action immédiate</div>
    <div class="field">
      <textarea id="action1"></textarea>
    </div>
  </div>
  
  <div class="row">
    <div class="label">Action long terme</div>
    <div class="field">
      <textarea id="action2"></textarea>
    </div>
  </div>
  
  <div class="row">
    <div class="label">Rédacteur *</div>
    <div class="field">
      <input type="text" id="redacteur">
    </div>
  </div>
  
  <button class="btn-main" onclick="envoyer()">
    ✅ Envoyer
  </button>
  
  </div>
<script>

// ✅ variables globales
let equipements = [];
let sites = [];


function selectMateriel(value, element) {

// stocker valeur
document.getElementById("materiel").value = value;

// reset tous les boutons
document.querySelectorAll(".btn-group button")
  .forEach(btn => btn.classList.remove("active"));

// activer bouton sélectionné
element.classList.add("active");
}

// ✅ AUTOCOMPLETE GENERIQUE
function createAutocomplete(inputId, listId, dataList) {

  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);

  input.addEventListener("focus", () => {
    showList("");
  });

  input.addEventListener("input", () => {
    showList(input.value);
  });

  function showList(filter) {

    const val = filter.toLowerCase();

    const results = dataList
      .filter(item => item.toLowerCase().includes(val))
      .slice(0, 200);

    if (results.length === 0) {
      list.innerHTML = "<div>Aucun résultat</div>";
    } else {
      list.innerHTML = results.map(item => `
        <div onclick="selectItem('${item.replace(/'/g, "\\'")}', '${inputId}', '${listId}')">
          ${item}
        </div>
      `).join("");
    }

    list.style.display = "block";
  }
}

// ✅ sélection
function selectItem(value, inputId, listId) {
  document.getElementById(inputId).value = value;
  document.getElementById(listId).style.display = "none";
}

// ✅ charger JSON
Promise.all([
  fetch("equipements.json").then(res => res.json()),
  fetch("sites.json").then(res => res.json())
]).then(([equipData, siteData]) => {

  equipements = equipData;
  sites = siteData;

  console.log("Equipements :", equipements.length);
  console.log("Sites :", sites.length);

  createAutocomplete("equipement", "equipementList", equipements);
  createAutocomplete("site", "siteList", sites);

});

// ✅ fermer liste si clic ailleurs
document.addEventListener("click", function(e) {
  if (!e.target.closest(".dropdown") && !e.target.closest("input")) {
    document.querySelectorAll(".dropdown").forEach(d => d.style.display = "none");
  }
});


// ✅ Auto date (remplit la date du jour)
document.getElementById("date").valueAsDate = new Date();

// ✅ ENVOI
function envoyer() {

const equipement = document.getElementById("equipement").value;
const description = document.getElementById("description").value;
const date = document.getElementById("date").value;
const site = document.getElementById("site").value;
const materiel = document.getElementById("materiel").value;
const redacteur = document.getElementById("redacteur").value;

if (!equipement || !description || !date || !site || !materiel || !redacteur) {
  alert("⚠️ Champs obligatoires manquants");
  return;
}

if (!confirm("✅ Confirmer l'envoi de la fiche ?")) return;

let baseUrl = "https://forms.office.com/Pages/ResponsePage.aspx?id=esFuUS-5i0OFlOEbb2vseRjkMUtrzTFJgkDRO6ovM4RUQzRENktIUTY4V0YwUFVVQ01QSlk5WkVPWC4u";

let url = baseUrl
  + "&r6224cbff49d94b79a69654caa3241ddf=" + encodeURIComponent(equipement)
  + "&r936dbfbe7b3a4f0ba57f4406807e37a5=" + encodeURIComponent(description)
  + "&rb1e2f7df928f43beacbe59f537d8b09b=" + encodeURIComponent(date)
  + "&r3fedaea8875d40899833d017ba9ff9fa=" + encodeURIComponent(site)
  + "&r9ac54388070a43748ea2b5514ff712d8=" + encodeURIComponent(materiel)
  + "&r38c32352ebca4f7e88f37c0de9bf0bf0=" + encodeURIComponent(redacteur);

window.location.href = url;
}

</script>

</body>
</html>
